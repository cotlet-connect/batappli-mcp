[project]
name = "batappli-mcp"
version = "1.1.0"
description = "Connect Batappli to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Batappli API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["batappli", "batappli api", "batappli mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/batappli-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=batappli"
Source = "https://github.com/cotlet-connect/batappli-mcp"

[project.scripts]
batappli-mcp = "batappli_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"batappli_agent.py" = "batappli_agent.py"

[tool.hatch.build.targets.sdist]
include = ["batappli_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
